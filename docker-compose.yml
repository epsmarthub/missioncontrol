services:
  missioncontrol-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: missioncontrol
      POSTGRES_USER: missioncontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in Coolify}
    volumes:
      - missioncontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missioncontrol -d missioncontrol"]
      interval: 10s
      timeout: 5s
      retries: 10

  missioncontrol:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      missioncontrol-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://missioncontrol:${POSTGRES_PASSWORD}@missioncontrol-db:5432/missioncontrol?schema=public
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:?OPENCLAW_API_KEY must be set in Coolify}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-5-mini}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
    expose:
      - "3000"
    networks:
      - default
      - coolify

volumes:
  missioncontrol_pgdata:

networks:
  coolify:
    external: true
